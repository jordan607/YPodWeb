# 1. Define the cache zone FIRST (outside any other blocks)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_python_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location / {
        # 2. Tell NGINX to use the zone defined above
        proxy_cache my_python_cache;
        
        # 3. Standard proxy settings
        proxy_pass http://web_app:5000;

            # --- ADD THESE FOR AUDIO STREAMING ---
    slice 1m; # Slices large files into 1MB chunks for the cache
    proxy_cache_key $uri$is_args$args$slice_range; # Essential: makes each slice unique in cache
    proxy_set_header Range $slice_range; # Passes the range request to the backend
    proxy_cache_valid 200 206 1h; # MUST include 206 to cache partial audio data
    # -------------------------------------

    # --- ADD THESE LINES TO FORCE CACHING ---
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie; # Ensures users don't get each other's cookies
    # ----------------------------------------


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 4. Cache control & Debugging
        proxy_cache_valid 200 5m;
        add_header X-Cache-Status $upstream_cache_status; # Shows HIT or MISS
    }
}